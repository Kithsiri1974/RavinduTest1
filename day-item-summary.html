<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Item Summary</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0f111a;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
    }
    .back-btn {
      text-decoration: none;
      color: #00ff88;
      font-weight: bold;
      border: 1px solid #00ff88;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: rgba(0, 255, 136, 0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #21262d;
    }
    th {
      background-color: #21262d;
      color: #00ff88;
      font-weight: 600;
    }
    tr:hover {
      background-color: #1f242c;
    }
    .total-row {
      background-color: #21262d;
      font-weight: bold;
    }
    .status-msg {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>📊 Day Item-wise Summary</h2>
    <a href="index.html" class="back-btn">← Back to Dashboard</a>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Item Code</th>
          <th>Description</th>
          <th>Size</th>
          <th>Total Qty Sold</th>
          <th>Unit Price (Rs.)</th>
          <th>Total Sales (Rs.)</th>
        </tr>
      </thead>
      <tbody id="summary-table-body">
        <tr>
          <td colspan="6" class="status-msg">Loading summary data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadDayItemSummary() {
      try {
        const response = await fetch('/api/day-item-summary');
        const data = await response.json();
        
        const tbody = document.getElementById('summary-table-body');
        tbody.innerHTML = '';

        if (!data.success || !data.items || data.items.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="status-msg">No sales recorded for today yet.</td></tr>`;
          return;
        }

        let grandTotalQty = 0;
        let grandTotalSales = 0;

        data.items.forEach(item => {
          const qty = parseFloat(item.total_qty) || 0;
          const sales = parseFloat(item.total_sales) || 0;

          grandTotalQty += qty;
          grandTotalSales += sales;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.it_code || '-'}</td>
            <td>${item.it_desc || 'Unknown Item'}</td>
            <td>${item.item_size || 'STD'}</td>
            <td><strong>${qty.toFixed(2)}</strong></td>
            <td>Rs. ${parseFloat(item.unit_price).toFixed(2)}</td>
            <td style="color: #00ff88; font-weight: bold;">Rs. ${sales.toFixed(2)}</td>
          `;
          tbody.appendChild(tr);
        });

        // Append Grand Total Row
        const totalTr = document.createElement('tr');
        totalTr.className = 'total-row';
        totalTr.innerHTML = `
          <td colspan="3" style="text-align: right; color: #00ff88;">GRAND TOTAL:</td>
          <td style="color: #00ff88;">${grandTotalQty.toFixed(2)}</td>
          <td>-</td>
          <td style="color: #00ff88; font-size: 1.1em;">Rs. ${grandTotalSales.toFixed(2)}</td>
        `;
        tbody.appendChild(totalTr);

      } catch (error) {
        console.error('Error fetching item summary:', error);
        document.getElementById('summary-table-body').innerHTML = `<tr><td colspan="6" class="status-msg" style="color: #ff4d4d;">Failed to load item summary data.</td></tr>`;
      }
    }

    loadDayItemSummary();
  </script>
</body>
</html>
